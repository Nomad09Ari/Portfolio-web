<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Russo+One&display=swap"
      rel="stylesheet"
    />
    <title>Login Form</title>
  </head>
  <body>
    <div class="wrapper">
      <h2>Sign up</h2>
      <form action="#">
        <input type="text" placeholder="Username" required />
        <input type="text" placeholder="Name" required />
        <input type="password" placeholder="Password" required />
        <input type="password" placeholder="Re-Enter-Password" required />
      </form>
      <div class="terms">
        <input type="checkbox" id="checkbox" />
        <label for="checkbox"
          >I agree to these <a href="#">Terms & Condition</a></label
        >
        <button>Sign Up</button>
        <div class="member">
          Not a member? <a href="./signup.html">Login Here</a>
        </div>
      </div>
    </div>
  </body>
</html>
