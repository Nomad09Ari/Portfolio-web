<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />

    <title>ScoreKeeper</title>
  </head>
  <body>
    <section class="section">
      <div class="container">
        <div class="columns">
          <div class="column is-half is-offset-one-quarter">
            <div class="card">
              <div class="card-image">
                <figure class="image is-2by1">
                  <img
                    src="https://images.unsplash.com/photo-1534158914592-062992fbe900?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=1798"
                  />
                </figure>
              </div>
              <header class="card-header">
                <p class="card-header-title">卓球得点表</p>
                <button class="card-header-icon" aria-label="more options">
                  <span class="icon">
                    <i class="fas fa-angle-down" aria-hidden="true"></i>
                  </span>
                </button>
              </header>
              <div class="card-content">
                <div class="content">
                  <h1 class="title is-1">
                    <span id="p1Display">0</span> 対
                    <span id="p2Display">0</span>
                  </h1>
                  <p class="subtitle is-size-6 pt-2">
                    下のボタンを押して得点を管理しよう！
                  </p>
                  <label for="winningScore" class="label is-large is-inline"
                    >何点先取？</label
                  >
                  <div class="select is-rounded">
                    <select name="" id="winningScore">
                      <option value="5">5</option>
                      <option value="6">6</option>
                      <option value="7">7</option>
                      <option value="8">8</option>
                      <option value="9">9</option>
                    </select>
                  </div>
                </div>
              </div>
              <footer class="card-footer">
                <button id="player1" class="is-primary button card-footer-item">
                  +1プレイヤー 1
                </button>
                <button id="player2" class="is-info button card-footer-item">
                  +1プレイヤー 2
                </button>
                <button id="reset" class="is-danger button card-footer-item">
                  リセット
                </button>
              </footer>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="app.js"></script>
  </body>
</html>
